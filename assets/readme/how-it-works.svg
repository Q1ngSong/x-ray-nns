<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">x-ray-nns 的工作原理</title>
  <desc id="desc">PyTorch 模型在本机运行一次，录制器按执行顺序记下 Operation、Tensor 和 Event，存成 Trace，播放器在浏览器里离线回放。</desc>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="24" fill="#f7f9fc" stroke="#d9e2ea"/>
  <g font-family="'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif">
    <g stroke="#9fb3c3" stroke-width="1.6" fill="none">
      <path d="M44 58v-10h866v10"/><path d="M974 58v-10h256v10"/>
    </g>
    <rect x="382" y="34" width="210" height="26" rx="13" fill="#f7f9fc"/>
    <text x="487" y="52" text-anchor="middle" font-size="14" fill="#5f7481">Python 端 · record once</text>
    <rect x="1000" y="34" width="204" height="26" rx="13" fill="#f7f9fc"/>
    <text x="1102" y="52" text-anchor="middle" font-size="14" fill="#5f7481">浏览器 · replay anywhere</text>
    <rect x="40" y="96" width="260" height="214" rx="16" fill="#ffffff" stroke="#d9e2ea"/><path d="M56 96h228" stroke="#6f93b1" stroke-width="5" stroke-linecap="round"/><path d="M66 136 l16 -8 l16 8 l-16 8 z" fill="#6f93b1" fill-opacity="0.18" stroke="#6f93b1" stroke-width="1.6" stroke-linejoin="round"/><path d="M66 145 l16 -8 l16 8 l-16 8 z" fill="#6f93b1" fill-opacity="0.38" stroke="#6f93b1" stroke-width="1.6" stroke-linejoin="round"/><path d="M66 154 l16 -8 l16 8 l-16 8 z" fill="#6f93b1" fill-opacity="0.5800000000000001" stroke="#6f93b1" stroke-width="1.6" stroke-linejoin="round"/><text x="116" y="152" font-size="22" font-weight="700" fill="#213442">PyTorch 模型</text><text x="64" y="206" font-size="14.5" fill="#4f6978">本地权重，本机真实运行</text><text x="64" y="232" font-size="14.5" fill="#4f6978">输入：一张图 + 几条 prompt</text><rect x="64" y="256" width="110" height="28" rx="8" fill="#6f93b1" fill-opacity="0.12"/><text x="75" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6f93b1">hf_models/…</text><rect x="350" y="96" width="260" height="214" rx="16" fill="#ffffff" stroke="#d9e2ea"/><path d="M366 96h228" stroke="#8f86b0" stroke-width="5" stroke-linecap="round"/><circle cx="392" cy="144" r="16" fill="none" stroke="#8f86b0" stroke-width="2"/><circle cx="392" cy="144" r="7" fill="#8f86b0"/><text x="426" y="152" font-size="22" font-weight="700" fill="#213442">录制器</text><text x="374" y="206" font-size="14.5" fill="#4f6978">forward hook 挂在每个模块上</text><text x="374" y="232" font-size="14.5" fill="#4f6978">按真实执行顺序记录</text><rect x="374" y="256" width="174" height="28" rx="8" fill="#8f86b0" fill-opacity="0.12"/><text x="385" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8f86b0">TorchModuleRecorder</text><rect x="660" y="96" width="260" height="214" rx="16" fill="#ffffff" stroke="#d9e2ea"/><path d="M676 96h228" stroke="#6f9e92" stroke-width="5" stroke-linecap="round"/><path d="M688 126h18l8 8v28h-26z" fill="#fff" stroke="#6f9e92" stroke-width="1.8" stroke-linejoin="round"/><path d="M693 140h14M693 146h10M693 152h12" stroke="#6f9e92" stroke-width="1.6"/><rect x="704" y="148" width="14" height="14" rx="2" fill="#6f9e92" fill-opacity="0.35" stroke="#6f9e92" stroke-width="1.6"/><text x="736" y="152" font-size="22" font-weight="700" fill="#213442">Trace</text><text x="684" y="206" font-size="14.5" fill="#4f6978">Operation · Tensor · Event</text><text x="684" y="232" font-size="14.5" fill="#4f6978">trace.json + tensors/*.pt</text><rect x="684" y="256" width="102" height="28" rx="8" fill="#6f9e92" fill-opacity="0.12"/><text x="695" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6f9e92">runs/&lt;名字&gt;/</text><rect x="970" y="96" width="260" height="214" rx="16" fill="#ffffff" stroke="#d9e2ea"/><path d="M986 96h228" stroke="#b78f70" stroke-width="5" stroke-linecap="round"/><rect x="994" y="129" width="36" height="30" rx="4" fill="none" stroke="#b78f70" stroke-width="1.8"/><path d="M994 136h36" stroke="#b78f70" stroke-width="1.6"/><path d="M1008 141l10 6l-10 6z" fill="#b78f70"/><text x="1046" y="152" font-size="22" font-weight="700" fill="#213442">播放器</text><text x="994" y="206" font-size="14.5" fill="#4f6978">index.html 双击即开，无需联网</text><text x="994" y="232" font-size="14.5" fill="#4f6978">2D · 3D · 时间线 · 面板</text><rect x="994" y="256" width="102" height="28" rx="8" fill="#b78f70" fill-opacity="0.12"/><text x="1005" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#b78f70">index.html</text><path d="M308 203H336" stroke="#9fb3c3" stroke-width="2.5"/><path d="M343 203l-10 -6v12z" fill="#9fb3c3"/><path d="M618 203H646" stroke="#9fb3c3" stroke-width="2.5"/><path d="M653 203l-10 -6v12z" fill="#9fb3c3"/><path d="M928 203H956" stroke="#9fb3c3" stroke-width="2.5"/><path d="M963 203l-10 -6v12z" fill="#9fb3c3"/>
